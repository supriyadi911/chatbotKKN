<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Monitoring KKN</title>
    <style>
        /* =========================================
           CSS VARIABLES & THEME SETUP
           ========================================= */
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --secondary: #0EA5E9;
            --bg-color: #F5F7FB;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: rgba(229, 231, 235, 0.6);
            
            --bubble-bot-bg: #FFFFFF;
            --bubble-bot-text: #1F2937;
            --bubble-user-bg: #2563EB;
            --bubble-user-text: #FFFFFF;

            --sidebar-bg: #FFFFFF;
            --sidebar-border: #E5E7EB;
            
            --font-size-base: 16px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
            --anim-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-solid: #1E293B;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: rgba(51, 65, 85, 0.6);
            
            --bubble-bot-bg: #1E293B;
            --bubble-bot-text: #F9FAFB;
            --bubble-user-bg: #2563EB;
            --bubble-user-text: #FFFFFF;

            --sidebar-bg: #0F172A;
            --sidebar-border: #1E293B;
        }

        /* Anti-Seleksi Teks secara Global untuk menghindari copy-paste sembarangan (Kecuali pada pesan chat) */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .message-bubble, .code-block-wrapper, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: var(--font-size-base);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background-color var(--anim-speed), color var(--anim-speed);
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            transition: transform var(--anim-speed) ease;
            z-index: 100;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--sidebar-border); }
        .new-chat-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 10px 15px; border-radius: var(--radius-sm);
            cursor: pointer; width: 100%; display: flex; align-items: center; gap: 10px;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .new-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .history-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 5px; }
        .history-item {
            padding: 10px; border-radius: var(--radius-sm); cursor: pointer; display: flex;
            align-items: center; gap: 10px; transition: background var(--anim-speed);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover, .history-item.active { background-color: var(--border-color); }
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--sidebar-border); display: flex; flex-direction: column; gap: 10px; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer; border-radius: var(--radius-sm); text-decoration: none; color: var(--text-main);}
        .menu-item:hover { background-color: var(--border-color); }

        /* MAIN CHAT AREA */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header {
            height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; }
        .bot-name { font-weight: 600; font-size: 1.1rem; }
        .bot-status { font-size: 0.8rem; color: #10B981; display: flex; align-items: center; gap: 5px; }
        .bot-status::before { content: ''; width: 8px; height: 8px; background-color: currentColor; border-radius: 50%; animation: pulse 2s infinite; }
        .icon-btn {
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            padding: 8px; border-radius: 50%; transition: background 0.2s, color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background-color: var(--border-color); color: var(--text-main); }

        .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* BUBBLES */
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: slideInUp 0.3s ease-out forwards; }
        .message-wrapper.bot { align-self: flex-start; }
        .message-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted); }
        .message-header .avatar {
            width: 24px; height: 24px; border-radius: 50%; background-color: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
        }
        .message-wrapper.bot .avatar { background-color: var(--secondary); }
        .message-bubble { padding: 12px 18px; border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); line-height: 1.5; word-wrap: break-word; }
        .message-wrapper.bot .message-bubble { background-color: var(--bubble-bot-bg); color: var(--bubble-bot-text); border-top-left-radius: 4px; }
        .message-wrapper.user .message-bubble { background-color: var(--bubble-user-bg); color: var(--bubble-user-text); border-top-right-radius: 4px; }
        .message-actions { display: flex; gap: 5px; margin-top: 5px; opacity: 0; transition: opacity 0.2s; }
        .message-wrapper:hover .message-actions { opacity: 1; }
        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 3px; }
        .action-btn:hover { color: var(--primary); }

        /* INPUT AREA */
        .input-area {
            padding: 20px; background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color); display: flex; align-items: flex-end; gap: 10px;
        }
        .input-wrapper {
            flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 10px 15px; display: flex; align-items: flex-end; transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        #chat-input {
            flex: 1; background: transparent; border: none; color: var(--text-main); resize: none;
            max-height: 150px; min-height: 24px; outline: none; padding: 0; font-size: var(--font-size-base); line-height: 1.5;
        }
        .send-btn {
            background-color: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, background 0.2s; margin-left: 10px;
        }
        .send-btn:hover { background-color: var(--primary-hover); }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: none; padding: 15px 20px; background-color: var(--bubble-bot-bg); border-radius: var(--radius-lg);
            border-top-left-radius: 4px; width: fit-content; box-shadow: var(--shadow-soft); align-self: flex-start; margin-bottom: 20px;
        }
        .typing-indicator.active { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        .scroll-bottom {
            position: absolute; bottom: 100px; right: 30px; background-color: var(--card-solid); color: var(--text-main);
            border: 1px solid var(--border-color); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-soft); z-index: 5;
        }

        /* MARKDOWN */
        .message-bubble h1, .message-bubble h2, .message-bubble h3 { margin-bottom: 10px; margin-top: 15px; font-size:1.1em;}
        .message-bubble p { margin-bottom: 10px; }
        .message-bubble ul, .message-bubble ol { margin-left: 20px; margin-bottom: 10px; }
        .message-bubble blockquote { border-left: 4px solid var(--primary); padding-left: 10px; color: var(--text-muted); margin: 10px 0; background: rgba(0,0,0,0.02); }
        .inline-code { background-color: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        [data-theme="dark"] .inline-code { background-color: rgba(255,255,255,0.1); }
        .code-block-wrapper { background-color: #1E293B; color: #F8FAFC; border-radius: 8px; margin: 10px 0; overflow: hidden; }
        .code-header { background-color: #0F172A; padding: 5px 10px; display: flex; justify-content: space-between; font-size: 0.8rem; color: #94A3B8; }
        .code-block-wrapper pre { padding: 15px; margin: 0; overflow-x: auto; font-family: monospace; font-size: 0.9rem; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-solid); padding: 25px; border-radius: var(--radius-md);
            width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); animation: zoomIn 0.2s ease-out;
        }
        .modal-title { margin-bottom: 20px; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; font-weight: bold;}
        .close-modal { background: none; border:none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight:600;}
        .form-group select {
            width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;
            background: var(--bg-color); color: var(--text-main);
        }
        .btn-danger { background-color: #EF4444; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-weight:bold;}

        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; opacity: 0.7; } 70% { box-shadow: 0 0 0 6px currentColor; opacity: 0; } 100% { box-shadow: 0 0 0 0 currentColor; opacity: 0; } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .message-wrapper { max-width: 95%; }
            .chat-container { padding: 15px; padding-bottom: 20px; }
            .input-area { padding: 12px; }
            .header { height: 65px; padding: 0 15px; }
        }
    </style>
    
    <script>
        // ==========================================
        // KEAMANAN APLIKASI (ANTI-INSPECT & COPY)
        // ==========================================
        
        // Memblokir klik kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Memblokir shortcut keyboard DevTools dan View Source
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { // F12
                return false;
            }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
                return false;
            }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
                return false;
            }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
                return false;
            }
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U (View Source)
                return false;
            }
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { // Ctrl+S (Save As)
                return false;
            }
            if(e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) { // Ctrl+P (Print)
                return false;
            }
        }
    </script>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="btn-new-chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Chat Baru
            </button>
        </div>
        
        <div style="padding: 10px 15px;">
            <input type="text" id="search-chat" placeholder="Cari riwayat chat..." style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-main); outline:none;">
        </div>

        <div class="history-list" id="chat-history-list"></div>

        <div class="sidebar-footer">
            <a href="#" class="menu-item" id="btn-settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Pengaturan Admin
            </a>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="main-content">
        <div id="mobile-overlay" style="display:none; position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.5); z-index:90;"></div>
        
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="btn-toggle-sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>

                    <span class="bot-name">Asisten KKN AI</span>

                </button>
                <button class="icon-btn" id="btn-clear-chat" title="Clear Chat (Ctrl+L)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>

        </header>

        <div class="chat-container" id="chat-container">
            <div class="typing-indicator" id="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>

        <button class="scroll-bottom" id="btn-scroll-bottom">

        <div class="input-area">

    <!-- MODAL PENGATURAN & DATABASE -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-content">
            <div class="modal-title">
                Pengaturan Admin
                <button class="close-modal" id="btn-close-settings">&times;</button>
            </div>
            
            <div class="form-group" style="background: rgba(37, 99, 235, 0.1); padding: 15px; border-radius: 8px; border: 1px solid rgba(37, 99, 235, 0.3);">
                <label style="color: var(--primary);">Sinkronisasi Database</label>
                <!-- URL INPUT TELAH DIHAPUS DEMI KEAMANAN -->
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">URL Database telah dienkripsi dan diamankan di dalam sistem. Klik tombol di bawah untuk menyinkronkan data secara manual.</p>
                
                <button id="btn-sync-gas" style="background-color: var(--primary); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight:bold;">Tarik Data Terbaru</button>

            <div class="form-group">
                <label>Ukuran Font</label>
                <select id="select-font-size">
                    <option value="14px">Kecil</option>
                    <option value="16px">Normal</option>
                    <option value="18px">Besar</option>
                </select>

            <div class="form-group">
                <label>Kecepatan Respon Bot</label>

                    <option value="500">Cepat (0.5s)</option>
                    <option value="1500">Normal (1.5s)</option>

    <script>
        class StorageManager {
            static get(key, defaultValue = null) {
                try {
                    const val = localStorage.getItem(key);
                    return val ? JSON.parse(val) : defaultValue;
                } catch (e) { return defaultValue; }
            }
            static set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } 
                catch (e) { console.error("Error writing to localStorage", e); }
            }
            static clearAll() { localStorage.clear(); }
        }

        class ThemeManager {
            constructor() {
                this.isDark = StorageManager.get('theme', 'light') === 'dark';
                this.btnTheme = document.getElementById('btn-theme');
                this.applyTheme();
                this.btnTheme.addEventListener('click', () => this.toggleTheme());
            }
            applyTheme() {
                if (this.isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    this.btnTheme.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"/></svg>';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    this.btnTheme.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
                }
            }
            toggleTheme() {
                this.isDark = !this.isDark;
                StorageManager.set('theme', this.isDark ? 'dark' : 'light');
                this.applyTheme();
            }
        }

        class BotEngine {
            constructor() {
                this.kknData = StorageManager.get('kkn_data', []);
                // URL GAS di-obfuscate dengan Base64 (Mencegah orang membaca URL secara mentah)
                this._0xAPI = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J6Q2NtSHFPOHhmVEFNd0x4REJMMWxOMW9KczEtSHA0RTBqVkZMYzdPa1pQR1Y5UE4tT3lmcnQ3b1VRYjllc2Q3dExrdy9leGVj";
            }

            async fetchFromGAS() {
                try {
                    const response = await fetch(this.getApiEndpoint());
                    const result = await response.json();

            parseMarkdown(text) {
                let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                safeText = safeText.replace(/```([\s\S]*?)```/g, '<div class="code-block-wrapper"><pre><code>$1</code></pre></div>');
                safeText = safeText.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
                safeText = safeText.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                safeText = safeText.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                safeText = safeText.replace(/^- (.*$)/gim, '<ul><li>$1</li></ul>');
                safeText = safeText.replace(/<\/ul>\n<ul>/gim, '');
                safeText = safeText.replace(/\n/g, '<br>');
                return safeText;
            }

            async getReply(userText) {
                const lowerText = userText.toLowerCase();
                let botReply = "";

                if (this.kknData.length === 0) {
                    botReply = "Halo! Saat ini Database dalam proses sinkronisasi, atau sedang kosong. Jika pesan ini berulang, harap lapor ke admin.";
                } else {
                    botReply = this.searchKKNData(lowerText, userText);
                }

                const delay = parseInt(StorageManager.get('animSpeed', 1000));
                return new Promise(resolve => setTimeout(() => resolve(this.parseMarkdown(botReply)), delay));
            }

            searchKKNData(query, rawQuery) {
                const data = this.kknData;
                
                const cleanQuery = query.replace(/[?.,!]/g, ' ').replace(/\s+/g, ' ').trim();
                const words = cleanQuery.split(' ');

                const askCount = /(berapa|jumlah|total)/i.test(cleanQuery);
                const askLocation = /(dimana|di mana|lokasi|tempat|desa|kampung)/i.test(cleanQuery);
                const askDPL = /(dpl|dosen|pembimbing)/i.test(cleanQuery);
                const askAccount = /(akun|username|password|login|sandi)/i.test(cleanQuery);
                const askMembers = /(anggota|siapa saja|daftar|nama nama)/i.test(cleanQuery);
                const askTematik = /(tematik)/i.test(cleanQuery); 

                const nimMatch = cleanQuery.match(/\d{8,12}/);
                if (nimMatch) {
                    const student = data.find(d => d['NIM_NIP'] && d['NIM_NIP'].includes(nimMatch[0]));
                    return this.generateStudentResponse(student, askLocation, askDPL, askAccount);
                }

                const kelMatch = cleanQuery.match(/(?:kelompok|kkn)\s*(\d+)/i);
                if (kelMatch) {
                    return this.generateGroupResponse(data, `Kelompok ${kelMatch[1]}`, askCount, askLocation, askDPL, askMembers, askAccount);
                }

                if (askTematik) {
                    let tematikData = data.filter(d => 
                        (d['Kelompok KKN'] && d['Kelompok KKN'].toLowerCase().includes('tematik')) || 
                        (d['Lokasi KKN'] && d['Lokasi KKN'].toLowerCase().includes('tematik')) ||
                        (d['Fakultas'] && d['Fakultas'].toLowerCase().includes('tematik'))
                    );

                    const stopWordsTematik = ['kkn', 'tematik', 'berapa', 'jumlah', 'siapa', 'saja', 'anggota', 'daftar', 'nama', 'di', 'lokasi', 'dpl', 'kelompok', 'tampilkan', 'berikan', 'yang', 'minta', 'info', 'mahasiswa'];
                    const specificKeywords = words.filter(w => !stopWordsTematik.includes(w) && w.length > 2);
                    
                    let filterName = "KKN Tematik";

                    if (specificKeywords.length > 0) {
                        const filtered = tematikData.filter(d => {
                            const combinedString = `${d['Kelompok KKN']} ${d['Lokasi KKN']} ${d['Fakultas']}`.toLowerCase();
                            return specificKeywords.every(kw => combinedString.includes(kw));
                        });

                        if (filtered.length > 0) {
                            tematikData = filtered;
                            const capitalizedWords = specificKeywords.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                            filterName = `KKN Tematik ${capitalizedWords}`;
                        } else {
                            return `Maaf, saya menemukan data KKN Tematik, tetapi tidak ada yang cocok dengan pencarian khusus: **"${specificKeywords.join(' ')}"**.\nPastikan ejaannya benar.`;
                        }
                    }

                    if (tematikData.length === 0) {
                        return `Maaf, saya tidak menemukan data mahasiswa, kelompok, atau lokasi untuk **${filterName}** di database saat ini.`;
                    }

                    const tematikMhs = tematikData.filter(d => d['Role'] !== 'kelompok' && d['NIM_NIP']);
                    const tematikGroups = [...new Set(tematikMhs.map(d => d['Kelompok KKN']))];

                    if (askCount) {
                        if (cleanQuery.includes('kelompok')) return `Terdapat **${tematikGroups.length} kelompok** ${filterName} yang terdaftar di sistem.`;
                        return `Terdapat total **${tematikMhs.length} mahasiswa** yang mengikuti ${filterName}, tersebar di ${tematikGroups.length} kelompok.`;
                    }

                    if (askMembers || cleanQuery.includes('nama mahasiswa') || cleanQuery.includes('daftar mahasiswa') || cleanQuery.includes('nama nama') || cleanQuery.includes('mahasiswa')) {
                        let response = `**Daftar Mahasiswa ${filterName}:**\n\n`;
                        const displayLimit = Math.min(tematikGroups.length, 5); 
                        
                        for (let i = 0; i < displayLimit; i++) {
                            const groupName = tematikGroups[i];
                            const groupMhs = tematikMhs.filter(d => d['Kelompok KKN'] === groupName);
                            const lokasi = groupMhs[0] ? groupMhs[0]['Lokasi KKN'] : '-';
                            const dpl = groupMhs[0] ? groupMhs[0]['DPL'] : '-';
                            
                            response += `### ${groupName}\n📍 *${lokasi}*\n👤 DPL: *${dpl}*\n`;
                            groupMhs.forEach((mhs, idx) => {
                                response += `${idx + 1}. ${mhs['Nama Lengkap']} (${mhs['NIM_NIP']})\n`;
                            });
                            response += `\n`;
                        }
                        if (tematikGroups.length > 5) {
                            response += `*...dan ${tematikGroups.length - 5} kelompok ${filterName} lainnya disembunyikan agar pesan tidak terlalu panjang. Anda bisa mencari spesifik per kelompok (contoh: 'siapa saja anggota ${tematikGroups[5] || 'kelompok tematik 6'}').*`;
                        }
                        return response;
                    }

                    if (cleanQuery.includes('kelompok') || cleanQuery.includes('lokasi') || cleanQuery.includes('daftar')) {
                        let response = `**Daftar Kelompok ${filterName} (${tematikGroups.length} Kelompok):**\n\n`;
                        const displayLimit = Math.min(tematikGroups.length, 10);
                        for (let i = 0; i < displayLimit; i++) {
                            const groupName = tematikGroups[i];
                            const groupMhs = tematikMhs.filter(d => d['Kelompok KKN'] === groupName);
                            const lokasi = groupMhs[0] ? groupMhs[0]['Lokasi KKN'] : '-';
                            response += `- **${groupName}** (${groupMhs.length} mhs) 📍 *${lokasi}*\n`;
                        }
                        if (tematikGroups.length > 10) response += `\n*...dan ${tematikGroups.length - 10} kelompok ${filterName} lainnya.*`;
                        response += `\n\n*Ketik nama kelompok secara spesifik (contoh: 'anggota ${tematikGroups[0] || 'kelompok 1'}') untuk melihat daftar lengkap anggotanya.*`;
                        return response;
                    }

                    return `**Informasi ${filterName}:**\n- **Total Mahasiswa:** ${tematikMhs.length} orang\n- **Total Kelompok:** ${tematikGroups.length} kelompok\n\n*Anda bisa bertanya lebih spesifik, seperti: 'Daftar nama mahasiswa ${filterName.toLowerCase()}' atau 'Berapa jumlah kelompok ${filterName.toLowerCase()}?'*`;
                }

                const stopWords = ['siapa', 'cari', 'nama', 'data', 'mahasiswa', 'kkn', 'di', 'ada', 'tolong', 'info', 'dari', 'itu', 'berapa', 'jumlah', 'lokasi', 'dpl', 'akun', 'password', 'username', 'kelompok', 'tampilkan', 'berikan', 'yang', 'bernama', 'minta'];
                const nameKeywords = words.filter(w => !stopWords.includes(w) && w.length > 2);

                if (nameKeywords.length > 0) {
                    let scoredStudents = data.filter(d => d['Role'] !== 'kelompok').map(student => {
                        let score = 0;
                        const studentName = (student['Nama Lengkap'] || '').toLowerCase();
                        nameKeywords.forEach(kw => { if (studentName.includes(kw)) score += 2; });
                        return { student, score };
                    }).filter(s => s.score > 0).sort((a, b) => b.score - a.score);

                    if (scoredStudents.length > 0) {
                        const topScore = scoredStudents[0].score;
                        const bestMatches = scoredStudents.filter(s => s.score === topScore).map(s => s.student);

                        if (bestMatches.length === 1) {
                            return this.generateStudentResponse(bestMatches[0], askLocation, askDPL, askAccount);
                        } else if (bestMatches.length <= 15) {
                            const list = bestMatches.map(d => `- **${d['Nama Lengkap']}** (${d['NIM_NIP']}) - ${d['Kelompok KKN']}`).join('\n');
                            return `Ada beberapa mahasiswa dengan nama tersebut (${bestMatches.length} orang):\n\n${list}\n\n*Ketik NIM mahasiswa yang Anda maksud untuk melihat detail atau info akunnya.*`;
                        } else {
                            return `Pencarian kata tersebut menemukan terlalu banyak hasil (${bestMatches.length} mahasiswa). Mohon gunakan nama belakangnya atau gunakan pencarian NIM.`;
                        }
                    }
                }

                if (askCount && (cleanQuery.includes('mahasiswa') || cleanQuery.includes('orang') || cleanQuery.includes('peserta'))) {
                    const totalMhs = data.filter(d => d['Role'] !== 'kelompok' && d['NIM_NIP']).length;
                    return `Berdasarkan database saat ini, total mahasiswa peserta KKN adalah **${totalMhs} orang**.`;
                }
                if (askCount && (cleanQuery.includes('kelompok'))) {
                    const groups = new Set(data.filter(d => d['Role'] !== 'kelompok' && d['Kelompok KKN']).map(d => d['Kelompok KKN']));
                    return `Terdapat total **${groups.size} kelompok** KKN yang terdaftar di sistem.`;
                }

                if (/halo|hai|pagi|siang|sore|malam|assalamualaikum/i.test(cleanQuery)) {
                    return "Halo! Saya adalah Asisten Cerdas KKN. Anda bisa bertanya tentang:\n- Data atau Akun mahasiswa (ketik NIM/Nama)\n- Info DPL atau Lokasi kelompok (Cth: *Dimana lokasi kelompok 1?*)\n- Info KKN Tematik (Cth: *Ada berapa kelompok kkn tematik ponpes?*)\n- Daftar anggota kelompok (Cth: *Siapa saja anggota kelompok 118?*)";
                }

                return "Maaf, saya tidak memahami pertanyaan tersebut. Coba tanyakan spesifik, contoh:\n- 'Dimana lokasi KKN kelompok 1?'\n- 'Siapa DPL mahasiswa bernama Bayu?'\n- 'Tampilkan anggota kelompok kkn tematik ponpes'\n- 'Minta akun NIM 2351020136'";
            }

            generateStudentResponse(student, askLocation, askDPL, askAccount) {
                if (!student) return `Maaf, data mahasiswa tersebut tidak ditemukan.`;
                if (askLocation) return `Lokasi KKN **${student['Nama Lengkap']}** (${student['NIM_NIP']}) berada di:\n**${student['Lokasi KKN'] || '-'}**\n*(Tergabung dalam ${student['Kelompok KKN'] || '-'})*.`;
                if (askDPL) return `Dosen Pembimbing Lapangan (DPL) untuk **${student['Nama Lengkap']}** adalah **${student['DPL'] || '-'}**.`;
                if (askAccount) return `**Informasi Akun:**\n- Nama: **${student['Nama Lengkap']}**\n- Username: \`${student['Username'] || '-'}\`\n- Password: \`${student['Password'] || '-'}\``;
                return `**Data Mahasiswa Ditemukan:**\n\n- **Nama:** ${student['Nama Lengkap'] || '-'}\n- **NIM:** ${student['NIM_NIP'] || '-'}\n- **Fakultas:** ${student['Fakultas'] || '-'}\n- **Kelompok:** ${student['Kelompok KKN'] || '-'}\n- **DPL:** ${student['DPL'] || '-'}\n- **Lokasi KKN:** ${student['Lokasi KKN'] || '-'}\n\n**Informasi Akun Login:**\n- **Username:** \`${student['Username'] || '-'}\`\n- **Password:** \`${student['Password'] || '-'}\``;
            }

            generateGroupResponse(data, groupName, askCount, askLocation, askDPL, askMembers, askAccount) {
                const kelData = data.filter(d => d['Kelompok KKN'] && d['Kelompok KKN'].toLowerCase() === groupName.toLowerCase() && d['Role'] !== 'kelompok');
                if (kelData.length === 0) return `Maaf, belum ada data untuk **${groupName}** di dalam sistem.`;
                const dpl = kelData[0]['DPL'] || '-';
                const lokasi = kelData[0]['Lokasi KKN'] || '-';
                
                if (askCount) return `Jumlah mahasiswa di **${groupName}** adalah **${kelData.length} orang**.`;
                if (askLocation) return `Lokasi penempatan KKN **${groupName}** berada di:\n**${lokasi}**`;
                if (askDPL) return `Dosen Pembimbing Lapangan (DPL) untuk **${groupName}** adalah:\n**${dpl}**`;
                
                if (askMembers || askAccount) {
                    let members = kelData.map((d, i) => {
                        let text = `${i+1}. ${d['Nama Lengkap']} (${d['NIM_NIP']})`;
                        if (askAccount) text += `\n   ↳ Akun: \`${d['Username']}\` | Pass: \`${d['Password']}\``;
                        return text;
                    }).join('\n');
                    return `**Daftar Anggota ${groupName}:**\n\n${members}\n\n**DPL:** ${dpl}\n**Lokasi:** ${lokasi}`;
                }
                return `**Ringkasan ${groupName}**\n\n- **Lokasi:** ${lokasi}\n- **DPL:** ${dpl}\n- **Jumlah Anggota:** ${kelData.length} mahasiswa.\n\n*Ketik 'siapa saja anggota ${groupName}' untuk melihat daftar nama, atau 'akun ${groupName}' untuk melihat seluruh akun mereka.*`;
            }
        }

        class ChatManager {
            constructor() {
                this.chats = StorageManager.get('chats', []);
                this.currentChatId = StorageManager.get('currentChatId', null);
                if (this.chats.length === 0) this.createNewChat();
                else if (!this.chats.find(c => c.id === this.currentChatId)) this.currentChatId = this.chats[0].id;
            }
            createNewChat() {
                const newId = 'chat_' + Date.now();
                this.chats.unshift({ id: newId, title: 'Percakapan Baru', messages: [], updatedAt: Date.now() });
                this.currentChatId = newId;
                this.saveChats();
            }
            getCurrentChat() { return this.chats.find(c => c.id === this.currentChatId); }
            addMessage(role, content, rawContent = null) {
                const chat = this.getCurrentChat();
                if (chat) {
                    if (chat.messages.length === 0 && role === 'user') {
                        chat.title = content.substring(0, 20) + (content.length > 20 ? '...' : '');
                    }
                    const msg = { id: 'msg_' + Date.now(), role, content, rawContent: rawContent || content, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
                    chat.messages.push(msg);
                    chat.updatedAt = Date.now();
                    this.chats.sort((a, b) => b.updatedAt - a.updatedAt);
                    this.saveChats();
                    return msg;
                }
            }
            deleteCurrentChat() {
                this.chats = this.chats.filter(c => c.id !== this.currentChatId);
                if (this.chats.length === 0) this.createNewChat();
                else this.currentChatId = this.chats[0].id;
                this.saveChats();
            }
            saveChats() {
                StorageManager.set('chats', this.chats);
                StorageManager.set('currentChatId', this.currentChatId);
            }
        }

        class UIManager {
            constructor(chatManager, botEngine) {
                this.chat = chatManager;
                this.bot = botEngine;
                this.dom = {
                    chatContainer: document.getElementById('chat-container'),
                    chatInput: document.getElementById('chat-input'),
                    btnSend: document.getElementById('btn-send'),
                    typingInd: document.getElementById('typing-indicator'),
                    historyList: document.getElementById('chat-history-list'),
                    btnNewChat: document.getElementById('btn-new-chat'),
                    btnClearChat: document.getElementById('btn-clear-chat'),
                    btnScrollBottom: document.getElementById('btn-scroll-bottom'),
                    sidebar: document.getElementById('sidebar'),
                    btnToggleSidebar: document.getElementById('btn-toggle-sidebar'),
                    mobileOverlay: document.getElementById('mobile-overlay'),
                    searchInput: document.getElementById('search-chat'),
                    botStatus: document.getElementById('bot-status'),
                    
                    // Settings
                    btnSettings: document.getElementById('btn-settings'),
                    modalSettings: document.getElementById('modal-settings'),
                    btnCloseSettings: document.getElementById('btn-close-settings'),
                    selectFontSize: document.getElementById('select-font-size'),
                    selectAnimSpeed: document.getElementById('select-anim-speed'),
                    btnResetApp: document.getElementById('btn-reset-app'),
                    btnSyncGas: document.getElementById('btn-sync-gas'),
                    csvStatus: document.getElementById('csv-status')
                };

                this.initEvents();
                this.renderHistory();
                this.loadCurrentChatUI();
                this.applySettings();
                this.updateCsvStatus();
                this.autoSyncDatabase();
            }

            async autoSyncDatabase() {
                this.dom.botStatus.innerHTML = "Menyinkronkan Data...";
                this.dom.botStatus.style.color = "#F59E0B"; 

                const result = await this.bot.fetchFromGAS();
                
                if (result.success) {
                    this.updateCsvStatus();
                    this.dom.botStatus.innerHTML = "Database Ready";
                    this.dom.botStatus.style.color = "#10B981"; 
                } else {
                    this.dom.botStatus.innerHTML = "Offline Mode";
                    this.dom.botStatus.style.color = "#EF4444"; 
                }
            }

            initEvents() {
                this.dom.chatInput.addEventListener('input', (e) => {
                    e.target.style.height = 'auto';
                    e.target.style.height = (e.target.scrollHeight < 150 ? e.target.scrollHeight : 150) + 'px';
                });
                this.dom.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.handleSend(); }
                });
                this.dom.chatInput.addEventListener('focus', () => { setTimeout(() => this.scrollToBottom(), 300); });
                this.dom.btnSend.addEventListener('click', () => this.handleSend());
                
                this.dom.btnNewChat.addEventListener('click', () => {
                    this.chat.createNewChat(); this.renderHistory(); this.loadCurrentChatUI();
                    if(window.innerWidth <= 768) this.closeSidebar();
                });
                this.dom.btnClearChat.addEventListener('click', () => {
                    if(confirm('Hapus percakapan saat ini?')) { this.chat.deleteCurrentChat(); this.renderHistory(); this.loadCurrentChatUI(); }
                });
                this.dom.chatContainer.addEventListener('scroll', () => {
                    const { scrollTop, scrollHeight, clientHeight } = this.dom.chatContainer;
                    this.dom.btnScrollBottom.style.display = (scrollHeight - scrollTop - clientHeight > 100) ? 'flex' : 'none';
                });
                this.dom.btnScrollBottom.addEventListener('click', () => this.scrollToBottom());
                this.dom.btnToggleSidebar.addEventListener('click', () => this.openSidebar());
                this.dom.mobileOverlay.addEventListener('click', () => this.closeSidebar());
                
                this.dom.searchInput.addEventListener('input', (e) => this.renderHistory(e.target.value));

                // Settings terkunci dengan PIN
                this.dom.btnSettings.addEventListener('click', (e) => { 
                    e.preventDefault(); 
                    const password = prompt("Masukkan PIN untuk mengakses Pengaturan Admin:");
                    if (password === "291188") {
                        this.openSettings(); 
                    } else if (password !== null) { 
                        alert("PIN salah! Akses ditolak.");
                    }
                });
                this.dom.btnCloseSettings.addEventListener('click', () => this.closeSettings());
                this.dom.selectFontSize.addEventListener('change', (e) => { StorageManager.set('fontSize', e.target.value); this.applySettings(); });
                this.dom.selectAnimSpeed.addEventListener('change', (e) => StorageManager.set('animSpeed', e.target.value));
                this.dom.btnResetApp.addEventListener('click', () => {
                    if(confirm("PERINGATAN: Semua riwayat chat dan cache akan terhapus. Lanjutkan?")) {
                        StorageManager.clearAll(); location.reload();
                    }
                });

                // Sinkronisasi Manual dari tombol di pengaturan (Tidak Butuh Input URL lagi)
                this.dom.btnSyncGas.addEventListener('click', async () => {
                    this.dom.btnSyncGas.textContent = "Sedang Menarik Data...";
                    this.dom.btnSyncGas.disabled = true;
                    
                    const result = await this.bot.fetchFromGAS();
                    
                    if(result.success) {
                        this.updateCsvStatus();
                        alert(`Berhasil menyinkronkan ${result.count} baris data KKN dari Database Terselubung!`);
                        this.dom.botStatus.innerHTML = "Database Ready";
                        this.dom.botStatus.style.color = "#10B981";
                    } else {
                        alert("Gagal menyinkronkan data: " + result.error);
                    }
                    
                    this.dom.btnSyncGas.textContent = "Tarik Data Terbaru";
                    this.dom.btnSyncGas.disabled = false;
                });
            }

            updateCsvStatus() {
                const count = this.bot.kknData.length;
                if(count > 0) {
                    this.dom.csvStatus.innerHTML = `<span style="color: green;">✔ Terenkripsi & Sinkronisasi Aktif (${count} baris data).</span>`;
                } else {
                    this.dom.csvStatus.innerHTML = `Status: Belum terhubung. Gagal memuat data.`;
                }
            }

            openSidebar() { this.dom.sidebar.classList.add('open'); this.dom.mobileOverlay.style.display = 'block'; }
            closeSidebar() { this.dom.sidebar.classList.remove('open'); this.dom.mobileOverlay.style.display = 'none'; }
            openSettings() {
                this.dom.modalSettings.classList.add('active');
                this.dom.selectFontSize.value = StorageManager.get('fontSize', '16px');
                this.dom.selectAnimSpeed.value = StorageManager.get('animSpeed', '1000');
            }
            closeSettings() { this.dom.modalSettings.classList.remove('active'); }
            applySettings() { document.documentElement.style.setProperty('--font-size-base', StorageManager.get('fontSize', '16px')); }

            renderHistory(filterText = "") {
                this.dom.historyList.innerHTML = '';
                this.chat.chats.forEach(c => {
                    if(filterText && !c.title.toLowerCase().includes(filterText.toLowerCase())) return;
                    const div = document.createElement('div');
                    div.className = `history-item ${c.id === this.chat.currentChatId ? 'active' : ''}`;
                    div.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${this.escapeHTML(c.title)}</span>`;
                    div.addEventListener('click', () => {
                        this.chat.currentChatId = c.id; this.chat.saveChats();
                        this.renderHistory(this.dom.searchInput.value); this.loadCurrentChatUI();
                        if(window.innerWidth <= 768) this.closeSidebar();
                    });
                    this.dom.historyList.appendChild(div);
                });
            }

            loadCurrentChatUI() {
                Array.from(this.dom.chatContainer.children).forEach(child => { if (child.id !== 'typing-indicator') child.remove(); });
                const current = this.chat.getCurrentChat();
                if (current && current.messages) current.messages.forEach(msg => this.renderMessage(msg, false));
                this.scrollToBottom();
            }

            async handleSend() {
                const text = this.dom.chatInput.value.trim();
                if (!text) return;
                this.dom.chatInput.value = ''; this.dom.chatInput.style.height = 'auto';

                const userMsg = this.chat.addMessage('user', text, text);
                this.renderMessage(userMsg);
                this.renderHistory(this.dom.searchInput.value);
                this.scrollToBottom();

                this.dom.typingInd.classList.add('active');
                this.dom.chatContainer.appendChild(this.dom.typingInd);
                this.scrollToBottom();

                const botReply = await this.bot.getReply(text);
                
                this.dom.typingInd.classList.remove('active');
                const botMsg = this.chat.addMessage('bot', botReply, botReply);
                this.renderMessage(botMsg);
                this.scrollToBottom();
            }

            renderMessage(msgData, animate = true) {
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${msgData.role}`;
                wrapper.id = msgData.id;
                if(!animate) wrapper.style.animation = 'none';

                const isUser = msgData.role === 'user';
                const avatarText = isUser ? 'U' : 'AI';
                const nameText = isUser ? 'Anda' : 'Bot KKN';
                const contentHTML = isUser ? this.escapeHTML(msgData.content).replace(/\n/g, '<br>') : msgData.content;

                wrapper.innerHTML = `
                    <div class="message-header">
                        <div class="avatar">${avatarText}</div><span>${nameText}</span><span style="font-size: 0.75rem;">${msgData.time}</span>
                    </div>
                    <div class="message-bubble">${contentHTML}</div>
                `;
                this.dom.chatContainer.insertBefore(wrapper, this.dom.typingInd);
            }

            scrollToBottom() {
                setTimeout(() => { this.dom.chatContainer.scrollTo({ top: this.dom.chatContainer.scrollHeight, behavior: 'smooth' }); }, 100);
            }

            escapeHTML(str) {
                const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = {
                theme: new ThemeManager(),
                bot: new BotEngine()
            };
            app.chat = new ChatManager();
            app.ui = new UIManager(app.chat, app.bot);
        });
    </script>
</body>
</html>
